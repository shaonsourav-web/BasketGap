name: Bug report
description: Something in BasketGap does not behave as documented.
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. BasketGap is an early-stage project, so a small, clear report helps a lot.

        **Please do not include:** secrets or API keys, personal information, or any retailer content (catalogue PDFs, screenshots of retailer sites or apps, product images, or real price dumps). If a bug only shows up with real retailer content, describe its shape and we will build a synthetic fixture together.

        **Security problems:** do not file them here. Use the private link on the issue chooser or see SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Where does the problem happen?
      options:
        - Matching engine (packages/shared)
        - Eval harness or playground (packages/shared)
        - API (packages/api)
        - Workers / ingestion (packages/workers)
        - Mobile app (packages/mobile)
        - Database migrations (supabase/)
        - Documentation
        - CI / tooling
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands or inputs, using synthetic data only. For matching problems, include the shopping-list line you typed.
      placeholder: |
        1. pnpm install
        2. pnpm --filter @basketgap/shared playground
        3. Type "..." and press Compare
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output, logs or error text
      description: Paste only what is needed. Remove any keys, tokens or personal details first.
      render: shell
  - type: dropdown
    id: keys
    attributes:
      label: Which optional provider keys were set?
      description: The engine runs fully offline with neither key set.
      options:
        - Neither (offline, deterministic only)
        - GEMINI_API_KEY only (embeddings)
        - OPENAI_API_KEY only (LLM fallback)
        - Both
        - Not applicable
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`. There are no tagged releases yet.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version (`node -v`) and pnpm version (`pnpm -v`).
      placeholder: macOS 15, Node 24.x, pnpm 11.0.9
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: My report contains no secrets, personal information or retailer content.
          required: true
